name: Release

# Cut a release by tagging:
#
#   git tag v2026.08.13 && git push origin v2026.08.13
#
# Date-based on purpose. A player holds a printed rulebook, and "2026-08-13"
# tells them how current it is at a glance; "v1.4.0" does not. A second release
# on the same day takes a serial — v2026.08.13.2.
#
# The edition date is printed in the footer of every page, so a player can tell
# which copy they are holding without opening a browser.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write   # to create the release and upload assets

env:
  TYPST_VERSION: '0.15.1'

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Typst ${{ env.TYPST_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL "$url" -o typst.tar.xz
          tar -xJf typst.tar.xz
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      # v2026.08.13 -> 2026-08-13, v2026.08.13.2 -> 2026-08-13.2
      - name: Derive the edition date from the tag
        id: edition
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          edition="$(echo "${tag#v}" | sed -E 's/^([0-9]{4})\.([0-9]{2})\.([0-9]{2})/\1-\2-\3/')"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "Building edition $edition from tag $tag"

      - name: Build the rulebook, print and screen
        run: |
          set -euo pipefail
          mkdir -p dist
          ed="${{ steps.edition.outputs.edition }}"
          # Flags spelled out rather than carried in a variable: an unquoted
          # expansion only splits into arguments under the shell's own rules,
          # and a build that depends on word-splitting breaks the first time
          # somebody runs it somewhere else.
          typst compile --root . --font-path typst/fonts --ignore-system-fonts \
            --input "edition=$ed" typst/rules.typ \
            "dist/cardboard-regatta-rulebook-$ed.pdf"
          typst compile --root . --font-path typst/fonts --ignore-system-fonts \
            --input "edition=$ed" --input theme=screen typst/rules.typ \
            "dist/cardboard-regatta-rulebook-screen-$ed.pdf"
          ls -la dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ed='${{ steps.edition.outputs.edition }}'
          gh release create "${{ steps.edition.outputs.tag }}" \
            --title "Cardboard Regatta — $ed" \
            --notes "Rulebook for Cardboard Regatta, edition $ed.

          * **\`cardboard-regatta-rulebook-$ed.pdf\`** — for printing: navy on white.
          * **\`cardboard-regatta-rulebook-screen-$ed.pdf\`** — for reading on a screen: light on navy.

          Both are the same rules, set from the same source, and carry the edition date in the page footer." \
            "dist/cardboard-regatta-rulebook-$ed.pdf" \
            "dist/cardboard-regatta-rulebook-screen-$ed.pdf"
