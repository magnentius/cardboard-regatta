name: Build

# Compiles the rulebook on every push and pull request, in both themes, and
# keeps the PDFs as artifacts so a change can be read rather than guessed at.
#
# The compile is also the test suite. rules.typ carries 437 cross-references as
# Typst labels, so a link to a section or glossary term that no longer exists
# fails this job — which is the whole reason the rules are not markdown any more.

on:
  push:
    branches: [main]
    paths:
      - 'typst/**'
      - 'images/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'typst/**'
      - 'images/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TYPST_VERSION: '0.15.1'

jobs:
  build:
    name: Compile the rulebook
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Typst ${{ env.TYPST_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL "$url" -o typst.tar.xz
          tar -xJf typst.tar.xz
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      # The diagrams are generated, so a hand-edit to an SVG would be silently
      # lost the next time anyone ran the tool. Regenerate and diff instead.
      - name: The generated diagrams must match their generator
        run: |
          set -euo pipefail
          python3 tools/gen_diagrams.py
          if ! git diff --quiet -- images; then
            echo "::error::images/ is out of date — run python3 tools/gen_diagrams.py and commit"
            git diff --stat -- images
            exit 1
          fi

      - name: Compile both themes
        run: |
          set -euo pipefail
          mkdir -p dist
          typst compile --root . --font-path typst/fonts --ignore-system-fonts \
            typst/rules.typ dist/cardboard-regatta-rulebook.pdf
          typst compile --root . --font-path typst/fonts --ignore-system-fonts \
            --input theme=screen \
            typst/rules.typ dist/cardboard-regatta-rulebook-screen.pdf
          ls -la dist

      # A rulebook that quietly loses half its pages is worse than one that
      # fails to build, and a bad show rule can do exactly that.
      - name: The book must be a plausible length
        run: |
          set -euo pipefail
          mkdir -p .pagecheck
          typst compile --root . --font-path typst/fonts --ignore-system-fonts \
            --format png --ppi 30 typst/rules.typ ".pagecheck/p-{p}.png"
          pages="$(find .pagecheck -name 'p-*.png' | wc -l | tr -d ' ')"
          echo "rendered $pages pages"
          if [ "$pages" -lt 25 ]; then
            echo "::error::only $pages pages — the book should be 30-plus"
            exit 1
          fi
          echo "total_pages=$pages" >> "$GITHUB_ENV"

      # The Quick Reference is a card: you print it double-sided and keep it
      # beside the board. Its type is tuned to fit exactly two pages, so a
      # third page means the tuning has been lost, not that the card grew.
      - name: The Quick Reference must still fit one double-sided sheet
        run: |
          set -euo pipefail
          start="$(typst eval 'query(<appendix-start-page>).first().value' \
            --in typst/rules.typ --root . --font-path typst/fonts --ignore-system-fonts)"
          span="$(( total_pages - start + 1 ))"
          echo "appendix starts on page $start of $total_pages — $span pages"
          if [ "$span" -ne 2 ]; then
            echo "::error::the Quick Reference spans $span pages, not 2 — retune typst/lib/quick-reference.typ"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rulebook-pdfs
          path: dist/*.pdf
          retention-days: 14
